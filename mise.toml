min_version = "2026.8.0"

[tools]
# Keep the Java version aligned with the JDK used by the GitHub Actions build.
java = "temurin-25"
node = "24.21.0"
pnpm = "12.10.1"
hk = "2.5.0"
ktlint = "1.8.0"

[tasks.test]
description = "Run the same checks as CI"
run = "mise x -- ./gradlew check -Pkotlin_tsgen_enableTsCompileTests=true --stacktrace"
run_windows = "mise x -- .\\gradlew.bat check -Pkotlin_tsgen_enableTsCompileTests=true --stacktrace"

[tasks.build]
description = "Compile all project targets without running tests"
run = "mise x -- ./gradlew assemble"
run_windows = "mise x -- .\\gradlew.bat assemble"

[tasks.docs]
description = "Generate and view the documentation site locally"
run = "mise x -- ./gradlew docusaurusRun"
run_windows = "mise x -- .\\gradlew.bat docusaurusRun"

[tasks."test:unit"]
description = "Run the fast JVM unit tests"
run = "mise x -- ./gradlew :modules:kotlin-tsgen-core:jvmTest"
run_windows = "mise x -- .\\gradlew.bat :modules:kotlin-tsgen-core:jvmTest"

[tasks."test:docs"]
description = "Run documentation example tests"
run = "mise x -- ./gradlew :docs:code:test -Pkotlin_tsgen_enableTsCompileTests=true --stacktrace"
run_windows = "mise x -- .\\gradlew.bat :docs:code:test -Pkotlin_tsgen_enableTsCompileTests=true --stacktrace"

[tasks."kotlin:refresh-js-lock"]
description = "Refresh the Kotlin/JS Yarn lockfile after a manual Kotlin version update"
run = "mise x -- ./gradlew kotlinUpgradeYarnLock kotlinStoreYarnLock --no-daemon"
run_windows = "mise x -- .\\gradlew.bat kotlinUpgradeYarnLock kotlinStoreYarnLock --no-daemon"

[tasks.lint]
description = "Run repository linters"
run = "hk check"

[tasks."lint:ktlint"]
description = "Run ktlint on the given Kotlin files"
usage = 'arg "[files]" var=#true help="Kotlin files to lint"'
shell = "powershell -ExecutionPolicy Bypass -Command"
run = '''#!/usr/bin/env bash
exec bash scripts/lint-ktlint.sh check{% for file in usage.files %} {{ file | quote }}{% endfor %}
'''
run_windows = '& ./scripts/lint-ktlint.ps1 check {{ usage.files | json_encode | b64_encode | quote }}; exit $LASTEXITCODE'

[tasks."lint:ktlint:fix"]
description = "Format the given Kotlin files with ktlint"
usage = 'arg "[files]" var=#true help="Kotlin files to format"'
shell = "powershell -ExecutionPolicy Bypass -Command"
run = '''#!/usr/bin/env bash
exec bash scripts/lint-ktlint.sh fix{% for file in usage.files %} {{ file | quote }}{% endfor %}
'''
run_windows = '& ./scripts/lint-ktlint.ps1 fix {{ usage.files | json_encode | b64_encode | quote }}; exit $LASTEXITCODE'

[tasks."lint:ci"]
description = "Lint the Kotlin files a change touches"
usage = 'arg "[base]" help="reference to compare against; defaults to origin/main"'
# CI runs against a clean checkout. Keep these exclusions aligned with hk.pkl's
# global exclude until the generated Knit files can be linted safely.
run = "bash scripts/lint-ci.sh"

[tasks."hk:install"]
description = "Install hk git hooks"
run = "hk install"

[tasks."hk:uninstall"]
description = "Uninstall hk git hooks"
run = "hk uninstall"

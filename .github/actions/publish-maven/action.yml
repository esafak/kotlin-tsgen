name: Publish Maven
description: Build and publish the Maven artifacts through NMCP

runs:
  using: composite
  steps:
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

    - name: Setup JDK
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: 17

    - name: Cache pnpm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-pnpm
      with:
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        path: |
          ./site/node_modules
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-cleanup: on-success

    - name: Run the publish task
      shell: bash
      run: ./gradlew nmcpPublish --stacktrace --no-configuration-cache --no-parallel

    - name: Upload build reports
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: build-report-${{ runner.os }}${{ github.action }}
        path: |
          **/build/reports/
          **/*.hprof
          **/*.log
        if-no-files-found: ignore

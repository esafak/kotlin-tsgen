name: Gradle Task
run-name: "Gradle Task ${{ inputs.gradle-task }} @ ${{ inputs.runs-on }}"

# Reusable Workflow for running a Gradle task

on:
  workflow_dispatch:
    inputs:
      gradle-task:
        description: "The approved Gradle task to run: check or docusaurusBuild"
        required: true
        type: string
      runs-on:
        description: "OS to run the task on"
        required: true
        type: string
      checkout-ref:
        description: "The branch, tag or SHA to checkout. See actions/checkout 'ref'."
        required: false
        type: string
      environment:
        description: "GitHub Actions environment for this task"
        required: false
        type: string
  workflow_call:
    inputs:
      gradle-task:
        description: "The approved Gradle task to run: check or docusaurusBuild"
        required: true
        type: string
      runs-on:
        description: "OS to run the task on"
        required: true
        type: string
      checkout-ref:
        description: "The branch, tag or SHA to checkout. See actions/checkout 'ref'."
        required: false
        type: string
      environment:
        description: "GitHub Actions environment for this task"
        required: false
        type: string


concurrency:
  group: "Gradle Task: ${{ github.workflow }} ${{ inputs.gradle-task }} @ ${{ inputs.runs-on }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true


permissions:
  contents: read
  checks: write # required by mikepenz/action-junit-report


jobs:

  run-task:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment || null }}
    name: "./gradlew ${{ inputs.gradle-task}} @ ${{ inputs.runs-on }}"
    timeout-minutes: 60
    env:
      MISE_LOCKED: "1"
    steps:

      ### Gradle task ###

      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Setup mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-pnpm
        with:
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          path: |
            ./site/node_modules
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-cleanup: on-success
      - name: Run check on Unix
        if: inputs.gradle-task == 'check' && runner.os != 'Windows'
        run: mise x -- ./gradlew check -Pkotlin_tsgen_enableTsCompileTests=true --stacktrace

      - name: Run check on Windows
        if: inputs.gradle-task == 'check' && runner.os == 'Windows'
        run: mise x -- .\\gradlew.bat check -Pkotlin_tsgen_enableTsCompileTests=true --stacktrace

      - name: Run site build
        if: inputs.gradle-task == 'docusaurusBuild' && runner.os != 'Windows'
        run: mise x -- ./gradlew docusaurusBuild

      - name: Run site build on Windows
        if: inputs.gradle-task == 'docusaurusBuild' && runner.os == 'Windows'
        run: mise x -- .\\gradlew.bat docusaurusBuild

      - name: Reject unsupported Gradle task
        if: inputs.gradle-task != 'check' && inputs.gradle-task != 'docusaurusBuild'
        run: |
          echo "Unsupported Gradle task input"
          exit 1

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-report-${{ runner.os }}${{ github.action }}
          path: |
            **/build/reports/
            **/*.hprof
            **/*.log
          if-no-files-found: ignore

      - name: Publish Test Reports
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        if: always()
        with:
          report_paths: |
            **/build/test-results/**/TEST-*.xml
          require_tests: false

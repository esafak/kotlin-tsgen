name: Gradle Task
run-name: "Gradle Task ${{ inputs.gradle-task }} @ ${{ inputs.runs-on }}"

# Reusable Workflow for running a Gradle task

on:
  workflow_dispatch:
    inputs:
      gradle-task:
        description: "The approved Gradle task to run: check or docusaurusBuild"
        required: true
        type: string
      runs-on:
        description: "OS to run the task on"
        required: true
        type: string
      checkout-ref:
        description: "The branch, tag or SHA to checkout. See actions/checkout 'ref'."
        required: false
        type: string
      environment:
        description: "GitHub Actions environment for this task"
        required: false
        type: string
  workflow_call:
    inputs:
      gradle-task:
        description: "The approved Gradle task to run: check or docusaurusBuild"
        required: true
        type: string
      runs-on:
        description: "OS to run the task on"
        required: true
        type: string
      checkout-ref:
        description: "The branch, tag or SHA to checkout. See actions/checkout 'ref'."
        required: false
        type: string
      environment:
        description: "GitHub Actions environment for this task"
        required: false
        type: string


concurrency:
  group: "Gradle Task: ${{ github.workflow }} ${{ inputs.gradle-task }} @ ${{ inputs.runs-on }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true


permissions:
  contents: read
  checks: write # required by mikepenz/action-junit-report


jobs:

  run-task:
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment || null }}
    name: "./gradlew ${{ inputs.gradle-task}} @ ${{ inputs.runs-on }}"
    timeout-minutes: 60
    env:
      MISE_LOCKED: "1"
    steps:

      ### Gradle task ###

      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Setup mise tools
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: false

      - name: Cache pnpm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: cache-pnpm
        with:
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          path: |
            ./site/node_modules
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Cache Playwright browsers
        if: inputs.gradle-task == 'check'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-1.61.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-cleanup: on-success
      - name: Run check on Unix
        if: inputs.gradle-task == 'check' && runner.os != 'Windows'
        run: |
          # The advisory audits read a checked-in lockfile and ask the npm
          # registry for the advisories of that tree, so the answer is the
          # same on every runner. The matrix runs them once, on Linux.
          audit_flags=""
          if [ "$RUNNER_OS" != "Linux" ]; then
            audit_flags="-x :yarnAudit -x :site:pnpmAudit"
          fi
          mise x -- ./gradlew check -Pkotlin_tsgen_enableTsCompileTests=true --stacktrace $audit_flags

      - name: Test the build logic
        if: inputs.gradle-task == 'check' && runner.os != 'Windows'
        run: mise x -- ./gradlew -p buildSrc test --stacktrace

      - name: Run check on Windows
        if: inputs.gradle-task == 'check' && runner.os == 'Windows'
        # The advisory audits are OS-independent, so the matrix runs them on
        # Linux only. See the Unix step above.
        run: mise x -- .\\gradlew.bat check -Pkotlin_tsgen_enableTsCompileTests=true --stacktrace -x :yarnAudit -x :site:pnpmAudit

      - name: Run site build
        if: inputs.gradle-task == 'docusaurusBuild' && runner.os != 'Windows'
        run: mise x -- ./gradlew docusaurusBuild

      - name: Run site build on Windows
        if: inputs.gradle-task == 'docusaurusBuild' && runner.os == 'Windows'
        run: mise x -- .\\gradlew.bat docusaurusBuild

      - name: Reject unsupported Gradle task
        if: inputs.gradle-task != 'check' && inputs.gradle-task != 'docusaurusBuild'
        run: |
          echo "Unsupported Gradle task input"
          exit 1

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-report-${{ runner.os }}${{ github.action }}
          path: |
            **/build/reports/
            **/*.hprof
            **/*.log
          if-no-files-found: ignore

      - name: Publish Test Reports
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: |
            **/build/test-results/**/TEST-*.xml
          require_tests: false

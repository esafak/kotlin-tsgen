name: Pi Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      min-severity:
        description: Minimum severity to report
        required: false
        default: warn
        type: choice
        options: [info, warn, critical]
      pr-number:
        description: Pull request number to review
        required: false
        type: number
      target-head:
        description: >-
          Optional commit to review up to, instead of the PR head. Must be an
          ancestor of the PR head, and must leave at least one unreviewed
          commit above the merge base.
        required: false
        type: string

# Review every PR update; never abort an in-flight review mid-generation.
concurrency:
  group: pi-reviewer-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number || github.run_id }}
  cancel-in-progress: false
  # Queue pending runs instead of the single-slot default. Bot-authored
  # comment events still enter this group but are skipped by the job `if:`;
  # without a multi-slot queue, a later bot run would evict an earlier
  # human-triggered run that is still pending.
  queue: max

jobs:
  check-comment:
    name: Resolve PR head
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head-sha: ${{ steps.commit.outputs.head-sha }}
      comment-authorized: ${{ steps.commit.outputs.comment-authorized }}
      same-repo: ${{ steps.commit.outputs.same-repo }}
    steps:
      - name: Resolve head commit and authorize commenter
        id: commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const payload = context.payload;
            // `workflow_dispatch` carries its inputs on the payload but no
            // `pull_request`, so fall back to the `pr-number` input. The
            // pi-reviewer action reads the same input itself; resolving it here
            // is what lets the caller checkout and fork-check the right PR.
            const dispatchInputs = payload.inputs ?? {};
            const dispatchPrNumber = Number(dispatchInputs['pr-number'] ?? dispatchInputs.pr_number);
            const pullRequestNumber = payload.pull_request?.number
              ?? (payload.issue?.pull_request ? payload.issue.number : undefined)
              ?? (Number.isFinite(dispatchPrNumber) && dispatchPrNumber > 0 ? dispatchPrNumber : undefined);

            let pullRequest;
            if (pullRequestNumber) {
              try {
                ({ data: pullRequest } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequestNumber,
                }));
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            let headSha = '';
            if (pullRequest) {
              headSha = pullRequest.head.sha;
            }
            core.setOutput('head-sha', headSha);

            // The review job holds secrets and write permissions, and the
            // pi-reviewer action reads package.json / pnpm-workspace.yaml from
            // the checked-out tree, so it must never process fork-controlled
            // code. Comment events and dispatch do not carry the PR in the
            // payload, so resolve the fork decision here and let the caller
            // gate on it. Fail closed when a PR number was supplied but could
            // not be resolved.
            let sameRepo = 'true';
            const isCommentEvent = [
              'pull_request_review_comment',
              'issue_comment',
            ].includes(context.eventName);
            if (pullRequest) {
              sameRepo = String(
                pullRequest.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`,
              );
            } else if (isCommentEvent || context.eventName === 'workflow_dispatch') {
              sameRepo = String(!pullRequestNumber);
            }
            if (pullRequestNumber && !pullRequest) {
              // Requested a PR but the lookup failed: do not fall through to a
              // default-branch checkout of unknown provenance.
              sameRepo = 'false';
            }
            core.setOutput('same-repo', sameRepo);

            // Review comments carry an unreliable author_association in the
            // Actions payload (an org owner is reported as CONTRIBUTOR), so
            // authorise commenters by their effective repository permission.
            let commentAuthorized = 'true';
            if (isCommentEvent) {
              commentAuthorized = 'false';
              const commenterLogin = payload.comment?.user?.login;
              if (commenterLogin) {
                try {
                  const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    username: commenterLogin,
                  });
                  commentAuthorized = String(
                    ['admin', 'write'].includes(data.permission),
                  );
                } catch (error) {
                  commentAuthorized = 'false';
                }
              }
            }
            core.setOutput('comment-authorized', commentAuthorized);

  review:
    name: Review
    needs: check-comment
    runs-on: ubuntu-latest
    environment: reviews
    permissions:
      contents: read
      pull-requests: write
      issues: write
    if: |
      !cancelled() &&
      needs.check-comment.result == 'success' &&
      needs.check-comment.outputs.same-repo == 'true' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
      (github.event_name != 'pull_request_review_comment' || github.event.comment.user.type != 'Bot') &&
      (github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot') &&
      ((github.event_name != 'pull_request_review_comment' && github.event_name != 'issue_comment') ||
        needs.check-comment.outputs.comment-authorized == 'true') &&
      (github.event_name != 'pull_request' || !endsWith(github.event.pull_request.user.login || '', 'renovate[bot]'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.check-comment.outputs.head-sha || github.event.pull_request.head.sha || github.sha }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: bot-token
        with:
          client-id: ${{ secrets.PI_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.PI_REVIEWER_PK }}
          # GitHub's resolveReviewThread mutation requires Contents write,
          # although the token only writes review-thread state.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Select provider API key
        shell: bash
        env:
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [ -z "$MODEL_NAME" ]; then
            echo "::error::Environment variable MODEL_NAME is required"
            exit 1
          fi
          provider="${MODEL_NAME%%/*}"
          case "$provider" in
            openai) key="$OPENAI_API_KEY" ;;
            anthropic) key="$ANTHROPIC_API_KEY" ;;
            zai) key="$ZAI_API_KEY" ;;
            *) echo "::error::Unsupported provider in MODEL_NAME: $provider"; exit 1 ;;
          esac
          if [ -z "$key" ]; then
            echo "::error::No API key configured for provider: $provider"
            exit 1
          fi
          echo "::add-mask::$key"
          printf 'PI_API_KEY=%s\n' "$key" >> "$GITHUB_ENV"

      - uses: esafak/pi-reviewer@072394fba571a928da2fda5ba1de1dffb756b519 # main
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          pi-api-key: ${{ env.PI_API_KEY }}
          model: ${{ vars.MODEL_NAME }}
          min-severity: ${{ inputs.min-severity || 'warn' }}
          review-drafts: 'false'
          react-on-no-findings: 'true'

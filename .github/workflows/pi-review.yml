name: Pi Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      min-severity:
        description: Minimum severity to report
        required: false
        default: warn
        type: choice
        options: [info, warn, critical]
      pr-number:
        description: Pull request number to review
        required: false
        type: number
      target-head:
        description: Optional ancestor commit to review
        required: false
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    environment: reviews
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !endsWith(github.event.pull_request.user.login || '', 'renovate[bot]') }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: pi-reviewer-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: bot-token
        with:
          client-id: ${{ secrets.PI_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.PI_REVIEWER_PK }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Select provider API key
        shell: bash
        env:
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [ -z "$MODEL_NAME" ]; then
            echo "::error::Environment variable MODEL_NAME is required"
            exit 1
          fi
          provider="${MODEL_NAME%%/*}"
          case "$provider" in
            openai) key="$OPENAI_API_KEY" ;;
            anthropic) key="$ANTHROPIC_API_KEY" ;;
            zai) key="$ZAI_API_KEY" ;;
            *) echo "::error::Unsupported provider in MODEL_NAME: $provider"; exit 1 ;;
          esac
          if [ -z "$key" ]; then
            echo "::error::No API key configured for provider: $provider"
            exit 1
          fi
          echo "::add-mask::$key"
          printf 'PI_API_KEY=%s\n' "$key" >> "$GITHUB_ENV"

      - uses: esafak/pi-reviewer@2221dd974fd193e705e0094f056ccf6b9fdbcb59 # main
        with:
          github-token: ${{ steps.bot-token.outputs.token }}
          pi-api-key: ${{ env.PI_API_KEY }}
          model: ${{ vars.MODEL_NAME }}
          min-severity: ${{ inputs.min-severity || 'warn' }}
          review-drafts: 'false'
          react-on-no-findings: 'true'

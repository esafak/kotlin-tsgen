name: Publish Maven


on:
  workflow_call: {}


concurrency:
  group: "Publish Maven: ${{ github.workflow }}"
  cancel-in-progress: false


permissions:
  contents: write
  packages: write
  checks: write


jobs:

  sonatype-release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      checks: write
    uses: ./.github/workflows/run_gradle_task.yml
    with:
      environment: maven
      runs-on: macos-latest # only macOS supports building all Kotlin targets
      gradle-task: >-
        nmcpPublish --stacktrace --no-configuration-cache --no-parallel

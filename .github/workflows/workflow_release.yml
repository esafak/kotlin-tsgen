name: Releases


on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]


concurrency:
  group: "Releases: ${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:

  tests:
    uses: ./.github/workflows/run_tests.yml
    permissions:
      checks: write
      contents: read

  publish-maven:
    needs: tests
    # publish snapshots from main and releases from version tags
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest # only macOS supports building all Kotlin targets
    environment: maven
    permissions:
      contents: read
    name: "./gradlew nmcpPublish @ macos-latest"
    timeout-minutes: 60
    steps:

      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/publish-maven
        env:
          MAVEN_SONATYPE_USERNAME: ${{ secrets.MAVEN_SONATYPE_USERNAME }}
          MAVEN_SONATYPE_PASSWORD: ${{ secrets.MAVEN_SONATYPE_PASSWORD }}
          MAVEN_SONATYPE_SIGNING_KEY_ID: ${{ secrets.MAVEN_SONATYPE_SIGNING_KEY_ID }}
          MAVEN_SONATYPE_SIGNING_KEY: ${{ secrets.MAVEN_SONATYPE_SIGNING_KEY }}
          MAVEN_SONATYPE_SIGNING_PASSWORD: ${{ secrets.MAVEN_SONATYPE_SIGNING_PASSWORD }}

  publish-site:
    needs: tests
    # only publish for version tags
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/run_publish_site.yml
    permissions:
      checks: write
      contents: read
      id-token: write   # to verify the deployment originates from an appropriate source
      packages: write
      pages: write      # to deploy to Pages

name: Tests


on:
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: "The branch, tag or SHA to checkout. See actions/checkout 'ref'."
        required: false
        type: string
  workflow_call:
    inputs:
      checkout-ref:
        description: "The branch, tag or SHA to checkout. See actions/checkout 'ref'."
        required: false
        type: string


concurrency:
  group: "Tests: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


permissions:
  contents: read
  checks: write # required by mikepenz/action-junit-report


jobs:

  lint:
    # The linters run on the Kotlin files a change touches. `hk validate` also
    # catches an hk.pkl that no longer matches the hk version: the config then
    # fails to load, and every linter silently stops running.
    #
    # The linters see the files the change touches, not the whole repository:
    # the tree still carries ktlint violations that a separate change drains.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - name: Validate the hk configuration
        run: mise x -- hk validate
      - name: Run the linters on the changed files
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          REF: ${{ github.ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            # a pull request: compare against the branch it targets
            base="refs/remotes/origin/$BASE_REF"
          elif [ -n "$MERGE_GROUP_BASE_SHA" ]; then
            # a merge group: compare against the branch it merges into
            base="$MERGE_GROUP_BASE_SHA"
          elif [ "$REF" = "refs/heads/main" ] && [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            # a push to main: compare against the commit before the push
            base="$BEFORE_SHA"
          else
            # a branch push or a manual run: compare against main
            base=$(git merge-base HEAD refs/remotes/origin/main)
          fi
          # hk falls back to checking every file when it cannot resolve the
          # base, so refuse to run rather than check the wrong set of files
          git rev-parse --verify --quiet "$base" > /dev/null
          echo "Linting the files that changed since $base"
          mise x -- hk check --from-ref "$base" --to-ref HEAD

  gradle-check:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: false
    uses: ./.github/workflows/run_gradle_task.yml
    with:
      runs-on: ${{ matrix.os }}
      gradle-task: check
      checkout-ref: ${{ inputs.checkout-ref }}

  build-site:
    # verify that the site can be built, but don't deploy it
    uses: ./.github/workflows/run_gradle_task.yml
    with:
      runs-on: ubuntu-latest
      gradle-task: docusaurusBuild
      checkout-ref: ${{ inputs.checkout-ref }}

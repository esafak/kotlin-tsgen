name: Tests


on:
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: "The branch, tag or SHA to checkout. See actions/checkout 'ref'."
        required: false
        type: string
  workflow_call:
    inputs:
      checkout-ref:
        description: "The branch, tag or SHA to checkout. See actions/checkout 'ref'."
        required: false
        type: string


concurrency:
  group: "Tests: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


permissions:
  contents: read
  checks: write # required by mikepenz/action-junit-report


jobs:

  lint:
    # CI uses mise directly; hk configuration is validated by local developer
    # hooks (`mise x -- hk validate`) rather than running hk in this job.
    #
    # ktlint sees changed Kotlin files; whitespace checks cover all changed
    # files. The repository still carries ktlint violations outside the diff.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          fetch-depth: 0
      - name: Setup mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - name: Lint changed Kotlin files and check whitespace
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF=origin/main
          fi
          # lint:ci validates this ref before diffing; never allow a missing
          # event base to widen the lint to the whole repository.
          mise run lint:ci "$BASE_REF"

  gradle-check:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: false
    uses: ./.github/workflows/run_gradle_task.yml
    with:
      runs-on: ${{ matrix.os }}
      gradle-task: check
      checkout-ref: ${{ inputs.checkout-ref }}

  build-site:
    # verify that the site can be built, but don't deploy it
    uses: ./.github/workflows/run_gradle_task.yml
    with:
      runs-on: ubuntu-latest
      gradle-task: docusaurusBuild
      checkout-ref: ${{ inputs.checkout-ref }}

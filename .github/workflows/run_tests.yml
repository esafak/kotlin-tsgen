name: Tests


on:
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: "The branch, tag or SHA to checkout. See actions/checkout 'ref'."
        required: false
        type: string
  workflow_call:
    inputs:
      checkout-ref:
        description: "The branch, tag or SHA to checkout. See actions/checkout 'ref'."
        required: false
        type: string


concurrency:
  group: "Tests: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


permissions:
  contents: read
  checks: write # required by mikepenz/action-junit-report


jobs:

  changes:
    runs-on: ubuntu-latest
    # If filtering fails, expose true outputs so dependent checks fail open.
    continue-on-error: true
    outputs:
      all: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000') || (github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.event_name != 'push' && github.event_name != 'workflow_dispatch') }}
      gradle: ${{ steps.filter.outputs.gradle }}
      site: ${{ steps.filter.outputs.site }}
      mise-task: ${{ steps.filter.outputs.mise }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          fetch-depth: 0
      - name: Filter changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Empty token uses git diff, including for PRs, so push, merge queue,
          # release, and manual events can share the same filter definitions.
          token: ""
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
          predicate-quantifier: some-with-excludes
          filters: |
            mise: &mise
              - 'mise.toml'
              - 'mise.lock'
            docs: &docs
              - 'docs/**'
              - '!docs/plans/**'
            build-model: &build-model
              - '**/*.gradle*'
              - 'buildSrc/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew*'
              - *mise
            gradle:
              - *build-model
              - '**/*.kt'
              - '**/*.kts'
              - '**/*.java'
              - *docs
              - 'site/pnpm-lock.yaml'
              - 'site/pnpm-workspace.yaml'
            site:
              - *build-model
              - *docs
              - 'site/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'

  lint:
    # CI uses mise directly; hk configuration is validated by local developer
    # hooks (`mise x -- hk validate`) rather than running hk in this job.
    #
    # ktlint checks every configured Kotlin source through mise templates;
    # whitespace checks cover the event's changed-file range.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          fetch-depth: 0
      - name: Setup mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - name: Lint Kotlin sources and check changed-file whitespace
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF=origin/main
          fi
          # The task fails if this base cannot be resolved. --force ensures
          # mise runs the source-glob lint on each fresh CI checkout.
          mise run --force lint:ci "$BASE_REF"

  gradle-check:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all != 'false' || needs.changes.outputs.gradle == 'true') }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
      fail-fast: false
    uses: ./.github/workflows/run_gradle_task.yml
    with:
      runs-on: ${{ matrix.os }}
      gradle-task: check
      checkout-ref: ${{ inputs.checkout-ref }}

  build-site:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all != 'false' || needs.changes.outputs.site == 'true') }}
    # verify that the site can be built, but don't deploy it
    uses: ./.github/workflows/run_gradle_task.yml
    with:
      runs-on: ubuntu-latest
      gradle-task: docusaurusBuild
      checkout-ref: ${{ inputs.checkout-ref }}

  mise-task-smoke:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.all != 'false' || needs.changes.outputs.mise-task == 'true') }}
    runs-on: windows-latest
    steps:
      - name: Checkout the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - name: Setup mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - name: Smoke-test the Windows ktlint task
        run: mise run lint:ktlint -- modules/kotlin-tsgen-core/src/commonMain/kotlin/io/github/esafak/kotlintsgen/KotlinTsConfig.kt

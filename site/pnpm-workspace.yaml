allowBuilds:
  '@parcel/watcher': true
  core-js: true

audit:
  ignore:
    - GHSA-w3rx-r6r6-pgpr # image-size is abandoned and published built pages themselves won't be affected
    - GHSA-5p2g-fcmc-qvqq # ditto

overrides:
  # When adding an override, first try unpinning stale overrides above;
  # remove any override whose upstream dependency chain now resolves safely.
  # GHSA-qj8w-gfj5-8c6v / CVE-2026-34043. copy-webpack-plugin ->
  # serialize-javascript; remove when the upstream dependency chain resolves
  # 7.0.5+ without an override.
  serialize-javascript: 7.1.0
  # GHSA-w5hq-g745-h8pq / CVE-2026-41907. webpack-dev-server -> sockjs ->
  # uuid; remove when the upstream dependency chain resolves 11.1.1+ without
  # an override.
  uuid: 14.0.2
  # GHSA-4mjr-xmp4-gh2g / CVE-2026-82417 and GHSA-x5fp-wj9c-mxmx /
  # CVE-2026-82562: qs versions before 6.16.0 are affected.
  # Remove when the upstream dependency chain resolves 6.16.0+ without an
  # override.
  qs: 6.16.0
  # CVE-2026-75899 / GHSA-fph4-wmhf-6fwf: fast-uri versions before 4.1.3
  # can disagree with Node's URL parser during normalization, allowing host
  # confusion/SSRF. Remove when the upstream dependency chain resolves 4.1.3+
  # without an override.
  'fast-uri@<4.1.3': '>=4.1.3'
  # GHSA-2883-xcg3-v3hh: js-yaml versions before 4.3.2 are affected.
  # Remove when the Docusaurus dependency chain resolves 4.3.2+.
  js-yaml: 4.3.2
  # GHSA-2wm5-q62r-hmrv: colord versions before 2.9.4 are affected.
  # Remove when the upstream dependency chain resolves 2.9.4+.
  colord: 2.10.0
  # GHSA-w27v-7q3p-w38r and GHSA-4vpr-x523-8j87: svgo versions before 3.3.5
  # are affected. Remove when the upstream dependency chain resolves 3.3.5+.
  svgo: 4.1.0

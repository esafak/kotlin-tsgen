allowBuilds:
  '@parcel/watcher': true
  core-js: true

overrides:
  # copy-webpack-plugin -> serialize-javascript; remove when the upstream
  # dependency chain resolves 7.0.5+ without an override.
  serialize-javascript: 7.0.5
  # webpack-dev-server -> sockjs -> uuid; remove when the upstream dependency
  # chain resolves 11.1.1+ without an override.
  uuid: 11.1.1

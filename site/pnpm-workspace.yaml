allowBuilds:
  '@parcel/watcher': true
  core-js: true

overrides:
  # GHSA-qj8w-gfj5-8c6v / CVE-2026-34043. copy-webpack-plugin ->
  # serialize-javascript; remove when the upstream dependency chain resolves
  # 7.0.5+ without an override.
  serialize-javascript: 7.0.5
  # GHSA-w5hq-g745-h8pq / CVE-2026-41907. webpack-dev-server -> sockjs ->
  # uuid; remove when the upstream dependency chain resolves 11.1.1+ without
  # an override.
  uuid: 11.1.1
  # CVE-2026-75899 / GHSA-fph4-wmhf-6fwf: fast-uri versions before 4.1.3
  # can disagree with Node's URL parser during normalization, allowing host
  # confusion/SSRF. Remove when the upstream dependency chain resolves 4.1.3+
  # without an override.
  'fast-uri@<4.1.3': '>=4.1.3'

allowBuilds:
  '@parcel/watcher': true
  core-js: true

overrides:
  # When adding an override, first try unpinning stale overrides above;
  # remove any override whose upstream dependency chain now resolves safely.
  # GHSA-qj8w-gfj5-8c6v / CVE-2026-34043. copy-webpack-plugin ->
  # serialize-javascript; remove when the upstream dependency chain resolves
  # 7.0.5+ without an override.
  serialize-javascript: 7.1.2
  # GHSA-w5hq-g745-h8pq / CVE-2026-41907. webpack-dev-server -> sockjs ->
  # uuid; remove when the upstream dependency chain resolves 14.0.0+ without
  # an override.
  uuid: 14.0.2
  # GHSA-4mjr-xmp4-gh2g / CVE-2026-82417 and GHSA-x5fp-wj9c-mxmx /
  # CVE-2026-82562: qs versions before 6.16.0 are affected.
  # Remove when the upstream dependency chain resolves 6.16.0+ without an
  # override.
  qs: 6.16.0
  # GHSA-8r9p-f939-6h3c / CVE-2026-111755 and GHSA-q3jh-wrc6-jgq8 /
  # CVE-2026-111756: follow-redirects versions before 1.16.1 are affected.
  # Remove when the upstream dependency chain resolves 1.16.1+ without an
  # override.
  'follow-redirects@<1.16.1': '>=1.16.1'

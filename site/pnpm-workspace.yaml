allowBuilds:
  '@parcel/watcher': true
  core-js: true

audit:
  ignore:
    # GHSA-vfj7-8cjw-p6xm: braces 3.0.3 is the latest release, so no patched
    # version exists. It is a stack-exhaustion denial of service reachable
    # only through deeply nested glob patterns, which the site's build-time
    # dependencies do not take from user input.
    - GHSA-vfj7-8cjw-p6xm

overrides:
  # When adding an override, first try unpinning stale overrides above;
  # remove any override whose upstream dependency chain now resolves safely.
  # GHSA-qj8w-gfj5-8c6v / CVE-2026-34043 and GHSA-m5mm-p8h7-m29v.
  # copy-webpack-plugin -> serialize-javascript; remove when the upstream
  # dependency chain resolves 7.1.4+ without an override.
  serialize-javascript: 7.1.4
  # GHSA-w5hq-g745-h8pq / CVE-2026-41907. webpack-dev-server -> sockjs ->
  # uuid; remove when the upstream dependency chain resolves 14.0.0+ without
  # an override.
  uuid: 14.0.3
  # GHSA-4mjr-xmp4-gh2g / CVE-2026-82417 and GHSA-x5fp-wj9c-mxmx /
  # CVE-2026-82562: qs versions before 6.16.0 are affected.
  # Remove when the upstream dependency chain resolves 6.16.0+ without an
  # override.
  qs: 6.16.1
  # GHSA-8r9p-f939-6h3c / CVE-2026-111755, GHSA-q3jh-wrc6-jgq8 /
  # CVE-2026-111756 and GHSA-mrwp-f3q8-3g9p: 1.16.0 and 1.16.1 are affected,
  # so 1.16.2 is the first patched release. Remove when the upstream
  # dependency chain resolves 1.16.2+ without an override.
  'follow-redirects@<1.16.2': '>=1.16.2'
  # GHSA-4528-x5fx-h6hg: joi before 17.13.9 is affected. It arrives through
  # @docusaurus/types, whose ^17 range the fix satisfies, so the pin stays in
  # the 17 line rather than floating to joi 18. Remove when that chain
  # resolves 17.13.9+ without an override.
  'joi@<17.13.9': '18.3.0'
  # GHSA-5gmw-xhrv-c9v3 and GHSA-85c8-ppgw-ccpr: tinypool versions before
  # 2.1.2 are affected. The 1.x line has no patched release. This overrides
  # @docusaurus/core's ^1.0.2 requirement across a major version; tinypool
  # 2.2.0 needs Node ^20 || >=22, and the site requires Node >=24.
  # Remove when the upstream dependency chain resolves patched versions
  # (2.1.2+) without an override.
  'tinypool@<2.1.2': '2.2.0'
  # GHSA-rj75-hqrm-r3gf: the advisory lists versions before 7.1.6 as affected.
  # 6.1.5 backported the fix, but the advisory still includes that release.
  # This overrides the legacy cssnano plugins' ^6 requirements across a
  # major version, keeping the tree on a release recognized as patched.
  # Remove when the Docusaurus/cssnano dependency chain no longer requires
  # 6.x and resolves patched versions (7.1.6+) without an override.
  # Tracked in #68.
  'postcss-selector-parser@<7.1.6': '7.1.7'
  # GHSA-27r3-jxmh-p828: body-parser 1.x before 1.20.9 is affected (DoS via
  # trailing bytes after a compressed request body), reachable via
  # @docusaurus/core -> webpack-dev-server -> express@4 -> body-parser.
  # The chain is Express 4, so the fix stays in the 1.x line; 1.20.9 is the
  # latest 1.x. body-parser 2.x is the Express 5 engine (needs >=2.4.0 for
  # this advisory), so a '>=1.20.9' range would cross a major and pull
  # content-type@2.x / iconv-lite@0.7.x into a 1.x consumer. Scoped to <1.20.9
  # so a future legitimate 2.x consumer is not forced back; a 2.0.0-2.3.x
  # consumer would still be caught by the audit (that range is also in the
  # advisory). Remove when the upstream chain resolves 1.20.9+ without an
  # override.
  'body-parser@<1.20.9': '1.20.9'
